<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>505 Travel App</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="scripts.js"></script>
</head>
<body>
  <div class="container">
    <section class="intro">
      <h1>Discover the world with 505</h1>
      <p>Last-minute hotel & stay bookings with personalized experiences.</p>
      <button class="explore-btn">Explore the Prototype</button>
      <div class="store-icons">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Available_on_the_App_Store_%28black%29_SVG.svg" alt="Apple Store" />
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play" />
      </div>
    </section>

    <section class="mockup">
      <div class="phone-ui">
        <header class="top-bar">
          <span class="logo">505</span>
          <nav>
            <a href="#">Stays</a>
            <a href="#">Experiences</a>
            <a href="#">Mobile app</a>
          </nav>
          <button class="lang-btn">EN</button>
        </header>

        <div class="hero">
          <div class="hero-text">
            <h2>Discover the world, your way</h2>
            <p>Book Last Minute Hotels and Stays</p>
            <button class="book-btn">Book Now</button>
          </div>
        </div>

        <div class="tabs">
          <button class="tab active">Stays</button>
          <button class="tab">Travel Packages</button>
        </div>

        <form class="booking-form">
          <input type="text" placeholder="Enter hotel destination" />
          <div class="date-pair">
            <input type="date" />
            <input type="date" />
          </div>
          <select>
            <option>1 Adult</option>
            <option>2 Adults</option>
            <option>Family</option>
          </select>
          <button type="submit" class="search-btn">Search Stays</button>
        </form>

        <footer class="bottom-nav">
          <a href="#">🏨</a>
          <a href="#">📦</a>
          <a href="#">🗺️</a>
          <a href="#">👤</a>
        </footer>
      </div>
    </section>
  </div>

  <footer class="wp-footer">
    <p>© 2025 505 Travel | Powered by WordPress</p>
  </footer>
</body>
</html>
