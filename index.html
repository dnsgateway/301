<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>505 Travel App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #2A2A72, #009FFD);
      color: #fff;
    }

    .container {
      display: flex;
      flex-direction: row;
      height: 100vh;
      width: 100%;
      padding: 40px;
      gap: 40px;
    }

    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 5%;
    }

    .left-panel h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .left-panel p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #e0e0e0;
    }

    .left-panel .btn {
      padding: 12px 20px;
      font-size: 1rem;
      background-color: #FFD600;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .store-icons {
      display: flex;
      gap: 15px;
    }

    .store-icons img {
      width: 130px;
      cursor: pointer;
    }

    .right-panel {
      flex: 1;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 30px rgba(0,0,0,0.3);
      padding: 20px;
    }

    .mockup {
      width: 100%;
      height: 100%;
      background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') no-repeat center center/cover;
      border-radius: 12px;
      padding: 20px;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .mockup .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mockup h2 {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .form-box {
      background: rgba(255,255,255,0.95);
      border-radius: 14px;
      color: #000;
      padding: 15px;
      margin-top: 20px;
    }

    .form-box label, .form-box input, .form-box select {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .form-box input, .form-box select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .form-box .submit {
      background: #FFD600;
      padding: 12px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    .bottom-nav {
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      margin-top: 20px;
    }

    .bottom-nav button {
      background: none;
      border: none;
      color: #fff;
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #111;
      color: #ccc;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <h1>505 Travel App</h1>
      <p>Discover last-minute hotels, curated experiences, and travel packages—your way.</p>
      <button class="btn">Try the Prototype</button>
      <div class="store-icons">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Available_on_the_App_Store_%28black%29_SVG.svg" alt="App Store">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play">
      </div>
    </div>
    <div class="right-panel">
      <div class="mockup">
        <div>
          <div class="top">
            <span><strong>505</strong> | Stays | Experiences</span>
            <button style="background:#FFD600; padding:4px 10px; border-radius:5px;">EN</button>
          </div>
          <h2>Discover the world,<br>your way</h2>
          <p>Book Last Minute Hotels and Stays</p>
          <button class="btn">Book Now</button>

          <div class="form-box">
            <label>Going to</label>
            <input type="text" placeholder="Enter hotel destination" />
            <label>Check-in Date</label>
            <input type="date" />
            <label>Check-out Date</label>
            <input type="date" />
            <label>Travelers</label>
            <select>
              <option>1 Adult</option>
              <option>2 Adults</option>
              <option>Family</option>
            </select>
            <button class="submit">Search Stays</button>
          </div>
        </div>
        <div class="bottom-nav">
          <button>Home</button>
          <button>Bookings</button>
          <button>Explore</button>
          <button>Account</button>
        </div>
      </div>
    </div>
  </div>
  <footer>
    © 2025 505 Travel. Proudly powered by WordPress.
  </footer>
</body>
</html>
